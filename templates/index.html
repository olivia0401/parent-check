{% extends "layout.html" %}

{% block main %}
  <h1>{{ t.home_title }}</h1>
  <p class="lead">{{ t.home_lead }}</p>

  <!-- safety warning: most important thing to see before typing anything -->
  <div class="safety">{{ t.safety_warning }}</div>

  {% if url_error %}
    <p class="url-error">{{ url_error }}</p>
  {% endif %}

  <form action="{{ url_for('check') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label for="content">{{ t.label_content }}</label>
    <textarea
      id="content"
      name="content"
      rows="6"
      maxlength="5000"
      placeholder="{{ t.placeholder }}"
      required
    >{{ prefill or "" }}</textarea>

    <label for="source">{{ t.label_source }}</label>
    <select id="source" name="source">
      {% for code in sources %}
        <option value="{{ code }}">{{ t.sources[code] }}</option>
      {% endfor %}
    </select>

    <button type="submit" class="big-button">{{ t.submit }}</button>
  </form>

  <!-- Or upload a screenshot: OCR reads the text out of it, then the same
       pipeline runs on that text. Auto-submits as soon as a file is picked. -->
  <form
    action="{{ url_for('check_image') }}"
    method="post"
    enctype="multipart/form-data"
    class="upload-form"
    id="upload-form"
  >
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <input type="hidden" name="source" value="suspicious_msg" />
    <label for="screenshot" class="upload-label">{{ t.upload_label }}</label>
    <input
      type="file"
      id="screenshot"
      name="image"
      accept="image/png,image/jpeg,image/webp"
      class="upload-input"
      data-reading="{{ t.image_reading }}"
      onchange="onScreenshotPicked(this)"
    />
    <p class="upload-status" id="upload-status" hidden></p>
  </form>

  <script>
    // Auto-submit once a screenshot is chosen, and show a "reading…" note so
    // the (few-second) OCR round-trip doesn't feel like nothing happened.
    function onScreenshotPicked(input) {
      if (!input.files || !input.files.length) return;
      var status = document.getElementById("upload-status");
      status.textContent = input.getAttribute("data-reading") || "Reading the image…";
      status.hidden = false;
      document.getElementById("upload-form").submit();
    }
  </script>

  <p class="trust">{{ t.trust_line }}</p>

  <!-- one-tap examples: fill the form so first-time users can see it work -->
  <section class="examples">
    <h2>{{ t.examples_heading }}</h2>
    {% for ex in t.examples %}
      <button
        type="button"
        class="example-chip"
        data-text="{{ ex.text }}"
        data-source="{{ ex.source }}"
        onclick="fillExample(this)"
      >
        {{ ex.label }}
      </button>
    {% endfor %}
  </section>

  <script>
    // Fill the input box and source dropdown from a clicked example.
    function fillExample(btn) {
      document.getElementById("content").value = btn.getAttribute("data-text");
      document.getElementById("source").value = btn.getAttribute("data-source");
      document.getElementById("content").focus();
    }
  </script>
{% endblock %}
