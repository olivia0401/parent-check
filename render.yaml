# lets Render's "Blueprint" set this app up in one click
services:
  - type: web
    name: parent-check
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade "pip>=26.2" && python -m pip install -r requirements.txt
    # gunicorn is the production WSGI server; bind to the port Render provides.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true   # Render generates a random secret for us
      # Required: a PostgreSQL database with the pgvector extension available
      # (e.g. a Render Postgres instance). Entered in the dashboard, not in git.
      - key: DATABASE_URL
        sync: false
      # Required for production shared throttling; unavailable Redis returns 503.
      - key: REDIS_URL
        sync: false
