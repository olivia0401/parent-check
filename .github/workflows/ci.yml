name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # Importing app.py runs db.init_db() (CREATE EXTENSION vector + create_all),
    # so the test suite needs a real Postgres with pgvector, not a stub. The
    # credentials/port match the default DATABASE_URL in db.py.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parentcheck
          POSTGRES_PASSWORD: parentcheck
          POSTGRES_DB: parentcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parentcheck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          DATABASE_URL: postgresql+psycopg2://parentcheck:parentcheck@localhost:5432/parentcheck
        run: python -m pytest -q
      - name: Eval quality gate
        # Fails the build if classifier quality regresses below thresholds
        # (accuracy / scam recall / missed scams / false alarms). See evaluate.py.
        run: python evaluate.py
      - name: Image-path eval
        # End-to-end screenshot -> OCR -> pipeline gate. Skips cleanly (exit 0)
        # when no OCR key is configured; enforces the gate once one is. The
        # deterministic wiring is covered by tests/test_check_image.py above.
        run: python evaluate_images.py

  frontend:
    # Type-check and build the Next.js frontend.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
