name: Deploy to Amazon ECS

# Optional CD for the Terraform ECS stack in infra/ (which is brought up on
# demand, not always on). Manual-only: run it from the Actions tab after
# `terraform apply -var="enable_cicd=true"`. It builds the container, pushes it
# to Amazon ECR and triggers a new deployment of the ECS (Fargate) service.
# The live site runs on EC2 with docker compose (see README) and is not
# deployed by this workflow.
#
# Requires the repository variable AWS_ROLE_ARN (Settings → Secrets and
# variables → Actions → Variables) = `terraform -chdir=infra output -raw
# github_deploy_role_arn`.
on:
  workflow_dispatch:

permissions:
  id-token: write           # required to request the OIDC token for AWS
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPO: parent-check
  ECS_CLUSTER: parent-check   # = var.project in infra/ecs.tf
  ECS_SERVICE: parent-check
  # OIDC role created by infra/iam.tf (no long-lived keys stored in GitHub).
  ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  # Quality gate: a classifier regression blocks the deploy entirely.
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Eval quality gate
        run: python evaluate.py

  deploy:
    needs: eval-gate        # only deploys if the eval gate passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPO:latest" \
            -t "$REGISTRY/$ECR_REPO:${{ github.sha }}" .
          docker push "$REGISTRY/$ECR_REPO:latest"
          docker push "$REGISTRY/$ECR_REPO:${{ github.sha }}"

      - name: Trigger ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --query 'service.serviceName' --output text
